name: release

# Pushing a tag v* builds and publishes a release:
#   1. GoReleaser: binaries, tarballs, .deb/.rpm, GitHub release, Homebrew cask
#   2. apt + dnf repositories on GitHub Pages (branch gh-pages)
# One-time setup (secrets, tap repository, Pages): docs/releasing.md

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Write package signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "secret GPG_PRIVATE_KEY is missing (docs/releasing.md)"; exit 1; }
          umask 077
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing-key.asc"
          echo "GPG_KEY_FILE=$RUNNER_TEMP/signing-key.asc" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.asc"

  package-repos:
    needs: goreleaser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Check out gh-pages (created on the first release)
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site \
            || { git init -b gh-pages site && git -C site remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils createrepo-c
      - name: Download packages of this release
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern '*.rpm' --dir pkgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Import signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"
      - name: Build apt and dnf repositories
        env:
          GPG_KEY_ID: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: src/scripts/publish-repos.sh pkgs site
      - name: Publish to gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "packages: ${GITHUB_REF_NAME}"
          git push origin gh-pages
      - name: Remove key material
        if: always()
        run: rm -rf ~/.gnupg
